name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Smoke tests
        run: |
          python -m unittest discover -s tests -v
          sh tests/shell/memory.sh
          sh tests/shell/memory-conformance.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff shellcheck-py
      - run: ruff check .
      - name: Installer checks
        run: |
          sh -n install.sh
          for script in skills/aiverywhere/scripts/*.sh tests/shell/*.sh; do
            sh -n "$script"
          done
          shellcheck install.sh skills/aiverywhere/scripts/*.sh tests/shell/*.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Install wheel outside the source tree
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/verify/bin/aiverywhere --version
          /tmp/verify/bin/python -m aiverywhere --help >/dev/null
          /tmp/verify/bin/python - <<'PY'
          from importlib.resources import files
          root = files("aiverywhere")
          for name in ("SKILL.md", "py.typed", "integrations/web/static/index.html",
                       "integrations/web/static/app.css", "integrations/web/static/app.js",
                       "skill/SKILL.md", "skill/references/memory.md",
                       "skill/scripts/init-instance.sh"):
              assert root.joinpath(name).is_file(), name
          print("packaged resources ok")
          PY
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/project"
          /tmp/verify/bin/aiverywhere --home "$tmp/instance" --project "$tmp/project" init >/dev/null
          test -f "$tmp/instance/skills/aiverywhere/references/memory.md"
          test -f "$tmp/instance/skills/aiverywhere/scripts/init-instance.sh"

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install through install.sh and verify host-only footprint
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/project"
          HOME="$tmp/home" AIVERYWHERE_BIN_DIR="$tmp/bin" \
            ./install.sh --yes --no-cli --home "$tmp/instance" --project "$tmp/project" --source "$GITHUB_WORKSPACE"
          test -f "$tmp/instance/skills/aiverywhere/SKILL.md"
          test -f "$tmp/instance/skills/aiverywhere/references/memory.md"
          test -f "$tmp/instance/skills/aiverywhere/scripts/init-instance.sh"
          test -L "$tmp/project/.agents/skills/aiverywhere"
          test ! -e "$tmp/instance/venv"
          test ! -f "$tmp/instance/data/config.json"
          export AIVERYWHERE_HOME="$tmp/instance"
          created=$(sh "$tmp/instance/skills/aiverywhere/scripts/write-memory.sh" \
            --project "$tmp/project" --kind fact --title '安装验收' --text '仅宿主安装可用' --source ci)
          entry=$(printf '%s\n' "$created" | jq -er .id)
          sh "$tmp/instance/skills/aiverywhere/scripts/read-memory.sh" "$entry" --project "$tmp/project" |
            grep -F '仅宿主安装可用'
          HOME="$tmp/home" AIVERYWHERE_BIN_DIR="$tmp/bin" \
            ./install.sh --yes --no-cli --home "$tmp/instance" --project "$tmp/project" --source "$GITHUB_WORKSPACE" >/dev/null
          sh "$tmp/instance/skills/aiverywhere/scripts/read-memory.sh" "$entry" --project "$tmp/project" |
            grep -F '仅宿主安装可用'
      - name: Install with optional CLI and environment credential
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/project"
          HOME="$tmp/home" AIVERYWHERE_BIN_DIR="$tmp/bin" \
            ANTHROPIC_API_KEY=ci-placeholder AIVERYWHERE_MODEL=ci-model \
            ./install.sh --yes --cli --home "$tmp/instance" --project "$tmp/project" --source "$GITHUB_WORKSPACE"
          test -L "$tmp/bin/aiverywhere"
          "$tmp/bin/aiverywhere" --version
          test -f "$tmp/instance/skills/aiverywhere/references/memory.md"
          test -f "$tmp/instance/skills/aiverywhere/scripts/init-instance.sh"
          grep -F '"api_key_env": "ANTHROPIC_API_KEY"' "$tmp/instance/config.json"
          test "$(stat -c '%a' "$tmp/instance/config.json")" = "600"
