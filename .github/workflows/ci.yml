name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Smoke tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff shellcheck-py
      - run: ruff check .
      - name: Installer checks
        run: |
          sh -n install.sh
          shellcheck install.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Install wheel outside the source tree
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/verify/bin/aiverywhere --version
          /tmp/verify/bin/python -m aiverywhere --help >/dev/null
          /tmp/verify/bin/python - <<'PY'
          from importlib.resources import files
          root = files("aiverywhere")
          for name in ("SKILL.md", "py.typed", "static/index.html", "static/app.css", "static/app.js"):
              assert root.joinpath(name).is_file(), name
          print("packaged resources ok")
          PY

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install through install.sh and verify host-only footprint
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/project"
          HOME="$tmp/home" AIVERYWHERE_BIN_DIR="$tmp/bin" \
            ./install.sh --yes --no-cli --home "$tmp/instance" --project "$tmp/project" --source "$GITHUB_WORKSPACE"
          test -f "$tmp/instance/data/SKILL.md"
          test -f "$tmp/instance/data/config.json"
          test -L "$tmp/project/.agents/skills/aiverywhere/SKILL.md"
          bin="$tmp/instance/venv/bin/aiverywhere"
          "$bin" --home "$tmp/instance" --project "$tmp/project" memory put '安装验收' '重复安装保留数据'
          # The project link should locate a custom install root without --home.
          (cd "$tmp/project" && "$bin" env | grep -F "\"instance_root\": \"$tmp/instance\"")
          HOME="$tmp/home" AIVERYWHERE_BIN_DIR="$tmp/bin" \
            ./install.sh --yes --no-cli --home "$tmp/instance" --project "$tmp/project" --source "$GITHUB_WORKSPACE" >/dev/null
          entry=$("$bin" --home "$tmp/instance" --project "$tmp/project" memory search '安装验收' |
            python -c 'import json, sys; print(json.load(sys.stdin)[0]["id"])')
          "$bin" --home "$tmp/instance" --project "$tmp/project" memory get "$entry" | grep -F '重复安装保留数据'
      - name: Install with optional CLI and environment credential
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/project"
          HOME="$tmp/home" AIVERYWHERE_BIN_DIR="$tmp/bin" \
            ANTHROPIC_API_KEY=ci-placeholder AIVERYWHERE_MODEL=ci-model \
            ./install.sh --yes --cli --home "$tmp/instance" --project "$tmp/project" --source "$GITHUB_WORKSPACE"
          test -L "$tmp/bin/aiverywhere"
          "$tmp/bin/aiverywhere" --version
          grep -F '"api_key_env": "ANTHROPIC_API_KEY"' "$tmp/instance/data/config.json"
          test "$(stat -c '%a' "$tmp/instance/data/config.json")" = "600"
