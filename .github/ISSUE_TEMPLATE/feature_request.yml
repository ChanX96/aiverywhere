name: 功能建议
description: 提出可验证的新能力或改进
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        项目优先用现有模型、工具和技能完成任务。请说明现有结构在哪个具体场景下不够用，以及怎样观察改动已经生效。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和设计文档
          required: true
        - label: 这个需求不能只用现有技能、MCP 或配置解决
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 用户从哪个入口、做什么任务时遇到什么阻碍
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 描述可观察的行为，不必先定实现
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 安装与配置
        - 宿主或 CLI 入口
        - 记忆、技能或 Dream
        - 计划与唤醒
        - 渠道与本地工作台
        - 文档或仓库工程
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 其他上下文
