name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          version = re.search(r'__version__ = "([^"]+)"', Path("src/aiverywhere/__init__.py").read_text())[1]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", f"tag {tag} does not match v{version}"
          print(f"releasing {tag}")
          PY
      - name: Build and check artifacts
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install dist/*.whl
          cd /tmp && /tmp/verify/bin/aiverywhere --version
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
