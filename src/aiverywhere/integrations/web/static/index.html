<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark"><meta name="session" content="__SESSION_TOKEN__">
  <link rel="icon" href="data:,"><link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script><title>aiverywhere · 本地工作台</title>
</head>
<body>
  <aside class="rail">
    <a class="brand" href="#overview" aria-label="aiverywhere 概览"><span class="brandmark" aria-hidden="true"></span>aiverywhere</a>
    <nav aria-label="工作空间">
      <p class="nav-label">工作空间</p>
      <a href="#chat" data-page="chat"><i class="ico spark" aria-hidden="true"></i>对话与工作</a>
      <a href="#overview" data-page="overview"><i class="ico grid" aria-hidden="true"></i>实例概览</a>
      <a href="#memory" data-page="memory"><i class="ico layers" aria-hidden="true"></i>记忆与技能</a>
      <a href="#agent" data-page="agent"><i class="ico file" aria-hidden="true"></i>Agent 定义</a>
      <a href="#sessions" data-page="sessions"><i class="ico spark" aria-hidden="true"></i>会话与任务</a>
      <a href="#logs" data-page="logs"><i class="ico terminal" aria-hidden="true"></i>运行日志</a>
    </nav>
    <div class="rail-foot"><i class="ico terminal" aria-hidden="true"></i><div>本地服务<span id="address"></span></div></div>
  </aside>
  <div class="shell">
    <header class="toolbar"><div class="crumb">工作空间 <span>/</span> <strong id="crumb">实例概览</strong></div>
      <div class="toolbar-actions"><span class="connection" id="connection" role="status">连接中</span>
        <button class="icon-button" id="refresh" aria-label="刷新数据" title="刷新数据"><i class="ico refresh"></i></button></div>
    </header>
    <main>
      <div class="heading"><div><h1 id="title">实例概览</h1><p class="path" id="subtitle"></p></div>
        <button class="primary" id="create"><span aria-hidden="true">＋</span> 新建条目</button></div>
      <div id="view" aria-busy="true"><p class="loading">正在读取本地实例…</p></div>
    </main>
  </div>
  <dialog id="editor" aria-labelledby="editor-title"><form id="entry-form">
    <div class="dialog-title"><h2 id="editor-title">新建条目</h2><button class="icon-button close" type="button" aria-label="关闭">×</button></div>
    <label>类型<select id="entry-kind"><option value="fact">项目记忆</option><option value="skill">可复用技能</option></select></label>
    <label>标题<input id="entry-title" required maxlength="160" autocomplete="off"></label>
    <label>正文<textarea id="entry-text" required maxlength="8000" rows="8"></textarea></label>
    <p class="form-error" id="entry-error" role="alert"></p>
    <div class="dialog-actions"><button class="danger" id="delete-entry" type="button">删除条目</button><span></span>
      <button class="secondary close" type="button">取消</button><button class="primary" type="submit">保存</button></div>
  </form></dialog>
  <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-info"><div class="dialog-title"><h2 id="confirm-title">确认删除</h2></div>
    <p id="confirm-info"></p><div class="dialog-actions"><span></span>
      <button class="secondary" id="confirm-no" autofocus>取消</button><button class="danger solid" id="confirm-yes">确认删除</button></div></dialog>
  <dialog id="detail" aria-labelledby="detail-title"><div class="dialog-title"><h2 id="detail-title">详情</h2><button class="icon-button close" type="button" aria-label="关闭">×</button></div>
    <pre id="detail-body" class="detail-body"></pre><div class="dialog-actions"><span></span><button class="secondary close" type="button">关闭</button></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
